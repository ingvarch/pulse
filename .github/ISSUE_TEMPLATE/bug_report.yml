name: Bug Report
description: File a bug report to help improve Pulse
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this issue? Please provide a minimal code example.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to see?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, Terminal emulator, Terminal font.
      value: |
        - OS: [e.g. macOS, Linux, Windows]
        - Go version: [e.g. 1.24]
        - Terminal: [e.g. Kitty, Ghostty, iTerm2, Alacritty, Windows Terminal]
    validations:
      required: true
