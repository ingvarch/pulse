name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.sum
            examples/go.sum

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted files found:"
            gofmt -d .
            exit 1
          fi

      - name: Go vet
        run: |
          go vet ./...
          go -C examples vet ./...

      - name: Run tests with race detector
        run: go test -v -race ./...

      - name: Build the library and cmd/gen-shots
        run: go build ./...

      - name: Build the examples
        run: go -C examples build ./...

      - name: Keep example dependencies out of the root module
        run: |
          if go list -m all | grep -E 'charm.land/bubbletea|shirou/gopsutil'; then
            echo "The root module must not depend on Bubble Tea or gopsutil; only examples/ may."
            exit 1
          fi
